[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ureonggaksi"
version = "0.1.1"
description = "Offline HWPX extraction with verifiable Excel provenance"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "regex>=2024.11.6",
  "kiwipiepy==0.24.1",
  "kiwipiepy-model==0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "pyinstaller>=6.11,<7"]

[project.scripts]
ureonggaksi = "ureonggaksi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100
# .pytest-tmp: 시험이 만드는 스크립트. Git 밖(컨테이너)에서는 .gitignore가 적용되지 않는다.
extend-exclude = ["docs", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
# kiwipiepy는 학습 도구(knlm)용으로 numpy를 요구하지만 형태소 분석에는 쓰지 않는다. numpy가 있으면 openpyxl이
# 불러와 메모리 상한을 건 XLSX 작업자에서 OpenBLAS 할당 실패가 난다. 배포물(EXE)과 같게 설치하지 않는다(DIF-064)
override-dependencies = ["numpy ; sys_platform == 'never'"]
