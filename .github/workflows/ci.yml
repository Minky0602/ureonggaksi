name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository. It never needs write access or secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep every main run so each merged commit has its own result; cancel stale PR runs only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # No display on CI runners. tests/conftest.py sets the same default.
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0t64 libdbus-1-3 libfontconfig1

      # --locked fails instead of silently re-resolving when uv.lock and pyproject.toml disagree.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Windows PowerShell 5.1 is what a Korean office PC runs by default.
      - name: Test and lint (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test.ps1

      - name: Test and lint (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/test.sh
